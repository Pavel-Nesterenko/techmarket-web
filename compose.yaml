services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: techmarket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: techmarket
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techmarket_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DB_HOST: db
      DB_PASSWORD: techmarket
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./react-app
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data: