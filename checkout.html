<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">

    <title>Оформление заказа — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>


<main class="main container">

    <h1 class="mb-4">Оформление заказа</h1>

    <form class="checkout-form">

        <section class="checkout-data shadow-sm">

            <h2>Контактные данные</h2>

            <div class="form-group">
                <label for="name">Имя:</label>

                <input
                    class="form-control"
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Имя"
                    required>
            </div>


            <div class="form-group">
                <label for="phone">Телефон:</label>

                <input
                    class="form-control"
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Телефон"
                    required>
            </div>


            <div class="form-group">
                <label for="email">E-mail:</label>

                <input
                    class="form-control"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="E-mail"
                    required>
            </div>


            <fieldset class="delivery-method">

                <legend>Способ получения</legend>

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        id="delivery"
                        name="delivery-method"
                        value="delivery"
                        checked>

                    <label class="form-check-label" for="delivery">
                        Доставка
                    </label>
                </div>

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        id="pickup"
                        name="delivery-method"
                        value="pickup">

                    <label class="form-check-label" for="pickup">
                        Самовывоз
                    </label>
                </div>

            </fieldset>


            <div class="form-group">

                <label for="address">Адрес доставки:</label>

                <input
                    class="form-control"
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Адрес">

            </div>

        </section>


        <section class="order-summary shadow-sm">

            <h2>Ваш заказ</h2>

            <ul class="list-group mb-4">

                <li class="list-group-item">
                    Смарт ТВ приставка × 1 — 4 990 ₽
                </li>

                <li class="list-group-item">
                    Смарт ТВ приставка × 1 — 4 990 ₽
                </li>

            </ul>


            <div class="order-price">

                <p>Товары: 9 980 ₽</p>

                <p>Доставка: Бесплатно</p>

                <p class="delivery-info">
                    Бесплатная доставка при заказе от 8 000 ₽
                </p>

                <p class="cart-total">
                    <strong>К оплате: 9 980 ₽</strong>
                </p>

            </div>


            <button class="order-button btn btn-dark" type="submit">
                Заказать
            </button>

        </section>

    </form>

</main>

</body>
</html>
