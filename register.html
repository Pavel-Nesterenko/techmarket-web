<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Регистрация — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>

<main class="main">

    <div class="auth-container">

        <section class="auth-card">

            <h1>Регистрация</h1>

            <form class="auth-form">

                <div class="form-group">
                    <label for="name">Имя:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Имя"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-mail"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Пароль"
                        required>
                </div>

                <div class="form-group">
                    <label for="password-repeat">Повторите пароль:</label>
                    <input
                        type="password"
                        id="password-repeat"
                        name="password-repeat"
                        placeholder="Повторите пароль"
                        required>
                </div>

                <button class="auth-button" type="submit">
                    Зарегистрироваться
                </button>

            </form>

            <p class="auth-link">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </p>

        </section>

    </div>

</main>

</body>
</html>
