<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — TechMarket</title>
</head>

<body>

<header>
    <a href="catalog.html">TechMarket</a>

    <nav>
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form>
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>

<main>

    <h1>Регистрация</h1>

    <form>

        <p>
            <label for="name">Имя:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Имя"
                required>
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="E-mail"
                required>
        </p>

        <p>
            <label for="password">Пароль:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Пароль"
                required>
        </p>

        <p>
            <label for="password-repeat">Повторите пароль:</label>
            <input
                type="password"
                id="password-repeat"
                name="password-repeat"
                placeholder="Повторите пароль"
                required>
        </p>

        <button type="submit">Зарегистрироваться</button>

    </form>

    <p>
        Уже есть аккаунт?
        <a href="login.html">Войти</a>
    </p>

</main>

</body>
</html>
