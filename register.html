<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">

    <title>Регистрация — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>


<main class="main container">

    <div class="auth-container">

        <section class="auth-card shadow-sm">

            <h1>Регистрация</h1>

            <form class="auth-form">

                <div class="form-group">

                    <label for="name">Имя:</label>

                    <input
                        class="form-control"
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Имя"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">E-mail:</label>

                    <input
                        class="form-control"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-mail"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">Пароль:</label>

                    <input
                        class="form-control"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Пароль"
                        required>

                </div>


                <div class="form-group">

                    <label for="password-repeat">Повторите пароль:</label>

                    <input
                        class="form-control"
                        type="password"
                        id="password-repeat"
                        name="password-repeat"
                        placeholder="Повторите пароль"
                        required>

                </div>


                <button class="auth-button btn btn-dark" type="submit">
                    Зарегистрироваться
                </button>

            </form>


            <p class="auth-link">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </p>

        </section>

    </div>

</main>

</body>
</html>
