<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Каталог — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>


<main class="main">

    <h1>Каталог товаров</h1>

    <div class="catalog-layout">

        <!-- ФИЛЬТРЫ -->
        <aside class="filters">

            <h2>Фильтры</h2>

            <div class="filter-group">
                <h3>Категории</h3>

                <ul>
                    <li><a href="#">Все товары</a></li>
                    <li><a href="#">TV Stick</a></li>
                    <li><a href="#">TV Box</a></li>
                    <li><a href="#">TV ресивер</a></li>
                </ul>
            </div>

            <div class="filter-group">
                <h3>Цена, ₽</h3>

                <div class="price-fields">

                    <div class="price-field">
                        <label for="price-from">От</label>
                        <input type="number"
                               id="price-from"
                               name="price-from"
                               placeholder="0">
                    </div>

                    <div class="price-field">
                        <label for="price-to">До</label>
                        <input type="number"
                               id="price-to"
                               name="price-to"
                               placeholder="10000">
                    </div>

                </div>
            </div>

        </aside>


        <!-- ТОВАРЫ -->
        <section class="products">

            <h2>Товары</h2>

            <div class="product-grid">

                <article class="product-card">

                    <a href="product.html">
                        <img src="images/product1.jpeg"
                             alt="Смарт ТВ приставка">
                    </a>

                    <h3>
                        <a href="product.html">
                            Смарт ТВ приставка
                        </a>
                    </h3>

                    <p>4K Ultra HD, 8/128 ГБ, Android</p>

                    <p class="price">
                        <strong>4 990 ₽</strong>
                    </p>

                    <a class="product-button" href="product.html">
                        Подробнее
                    </a>

                </article>

            </div>

        </section>

    </div>

</main>

</body>
</html>
