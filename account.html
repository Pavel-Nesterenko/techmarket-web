<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">

    <title>Личный кабинет — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="account.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>


<main class="main container">

    <h1 class="mb-4">Личный кабинет</h1>

    <div class="account-layout">

        <section class="account-data shadow-sm">

            <h2>Личные данные</h2>

            <p>
                <strong>Имя:</strong>
                Иван Иванов
            </p>

            <p>
                <strong>E-mail:</strong>
                email@gmail.com
            </p>

            <button class="account-button btn btn-dark" type="button">
                Редактировать данные
            </button>

            <p class="logout-link">
                <a href="login.html">Выйти</a>
            </p>

        </section>


        <section class="order-history shadow-sm">

            <h2>История заказов</h2>

            <article class="order-card">

                <h3>Заказ №01</h3>

                <p>
                    <strong>Дата:</strong>
                    08.09.2026
                </p>

                <p>
                    <strong>Статус:</strong>
                    <span class="badge text-bg-success">Выполнен</span>
                </p>

                <h4>Состав заказа</h4>

                <ul class="list-group mb-3">
                    <li class="list-group-item">
                        Смарт ТВ приставка × 1
                    </li>
                </ul>

                <p>
                    <strong>Сумма заказа:</strong>
                    4 990 ₽
                </p>

            </article>

        </section>

    </div>

</main>

</html>
