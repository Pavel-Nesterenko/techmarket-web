<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — TechMarket</title>
</head>

<body>

<header>
    <a href="catalog.html">TechMarket</a>

    <nav>
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form>
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>

<main>

    <h1>Корзина</h1>

    <section>
        <h2>Товары в корзине</h2>

        <article>
            <img src="images/product1.jpeg" alt="Смарт ТВ приставка">

            <p>TV Box</p>
            <h3>Смарт ТВ приставка</h3>

            <p>Цена: <strong>4 990 ₽</strong></p>

            <label for="quantity-1">Количество:</label>
            <input type="number"
                   id="quantity-1"
                   name="quantity-1"
                   value="1"
                   min="1">

            <button type="button">Удалить</button>
        </article>

        <article>
            <img src="images/product2.jpeg" alt="Смарт ТВ приставка">

            <p>TV Box</p>
            <h3>Смарт ТВ приставка</h3>

            <p>Цена: <strong>4 990 ₽</strong></p>

            <label for="quantity-2">Количество:</label>
            <input type="number"
                   id="quantity-2"
                   name="quantity-2"
                   value="1"
                   min="1">

            <button type="button">Удалить</button>
        </article>
    </section>

    <section>
        <h2>Итого</h2>

        <p>Товары: 9 980 ₽</p>
        <p>Доставка: Бесплатно</p>
        <p>Бесплатная доставка при заказе от 8 000 ₽</p>

        <p><strong>К оплате: 9 980 ₽</strong></p>

        <a href="checkout.html">Оформить заказ</a>
    </section>

</main>

</html>
