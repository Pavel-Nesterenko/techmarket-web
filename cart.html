<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Корзина — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>

<main class="main">

    <h1>Корзина</h1>

    <div class="cart-layout">

        <section class="cart-items">
            <h2>Товары в корзине</h2>

            <article class="cart-item">
                <img src="images/product1.jpeg" alt="Смарт ТВ приставка">

                <div class="cart-item-info">
                    <p class="product-category">TV Box</p>
                    <h3>Смарт ТВ приставка</h3>

                    <p>Цена: <strong>4 990 ₽</strong></p>

                    <div class="cart-actions">
                        <label for="quantity-1">Количество:</label>

                        <input type="number"
                               id="quantity-1"
                               name="quantity-1"
                               value="1"
                               min="1">

                        <button type="button">Удалить</button>
                    </div>
                </div>
            </article>

            <article class="cart-item">
                <img src="images/product2.jpeg" alt="Смарт ТВ приставка">

                <div class="cart-item-info">
                    <p class="product-category">TV Box</p>
                    <h3>Смарт ТВ приставка</h3>

                    <p>Цена: <strong>4 990 ₽</strong></p>

                    <div class="cart-actions">
                        <label for="quantity-2">Количество:</label>

                        <input type="number"
                               id="quantity-2"
                               name="quantity-2"
                               value="1"
                               min="1">

                        <button type="button">Удалить</button>
                    </div>
                </div>
            </article>

        </section>


        <section class="cart-summary">
            <h2>Итого</h2>

            <p>Товары: 9 980 ₽</p>
            <p>Доставка: Бесплатно</p>

            <p class="delivery-info">
                Бесплатная доставка при заказе от 8 000 ₽
            </p>

            <p class="cart-total">
                <strong>К оплате: 9 980 ₽</strong>
            </p>

            <a class="checkout-button" href="checkout.html">
                Оформить заказ
            </a>
        </section>

    </div>

</main>

</body>
</html>
