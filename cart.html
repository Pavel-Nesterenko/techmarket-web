
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">

    <title>Корзина — TechMarket</title>
</head>

<body>

<header class="header">
    <a class="logo" href="catalog.html">TechMarket</a>

    <nav class="nav">
        <a href="catalog.html">Каталог</a>
        <a href="support.html">Поддержка</a>
        <a href="login.html">Личный кабинет</a>
        <a href="cart.html">Корзина</a>
    </nav>

    <form class="search">
        <label for="search">Поиск товаров</label>
        <input type="search" id="search" name="search" placeholder="Поиск">
        <button type="submit">Найти</button>
    </form>
</header>


<main class="main container">

    <h1 class="mb-4">Корзина</h1>

    <div class="cart-layout">

        <!-- ТОВАРЫ В КОРЗИНЕ -->
        <section class="cart-items">

            <h2>Товары в корзине</h2>

            <!-- Товары будут добавляться JavaScript -->
            <div id="cart-items-list">

                <p>Корзина пуста.</p>

            </div>

        </section>


        <!-- ИТОГОВАЯ СТОИМОСТЬ -->
        <section class="cart-summary shadow-sm">

            <h2>Итого</h2>

            <p>
                Товары:
                <span id="cart-subtotal">0 ₽</span>
            </p>

            <p>
                Доставка:
                <span id="cart-delivery">0 ₽</span>
            </p>

            <p class="delivery-info">
                Бесплатная доставка при заказе от 8 000 ₽
            </p>

            <p class="cart-total">
                <strong>
                    К оплате:
                    <span id="cart-total">0 ₽</span>
                </strong>
            </p>

            <a
                class="checkout-button btn btn-dark"
                href="checkout.html"
                id="checkout-button">
                Оформить заказ
            </a>

        </section>

    </div>

</main>

<!-- JavaScript для работы корзины -->
<script src="js/cart.js"></script>

</body>
</html>
